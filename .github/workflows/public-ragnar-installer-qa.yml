# Dosya Yolu: .github/workflows/public-ragnar-installer-qa.yml
# Amac: Ragnar preview Windows installer test artifactini dogrudan public dagitim deposunda uretmek
# Modul - GitHub Actions YAML
# Version: 1.1.0-qa
# Aciklama: Tam olarak pinli public Beam kaynak commitinden build; private client'a baglanmaz
# Bagimli Oldugu Katman: LevelUpGT/beam-patcher reusable QA workflow | Public distribution

name: Public Ragnar Installer QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/public-beam-installer-qa-20261024
    paths:
      - ".github/workflows/public-ragnar-installer-qa.yml"
      - "installer/qa/**"
      - "tests/test_public_installer_contract.py"
  pull_request:
    paths:
      - ".github/workflows/public-ragnar-installer-qa.yml"
      - "installer/qa/**"
      - "tests/test_public_installer_contract.py"

permissions:
  contents: read

concurrency:
  group: public-ragnar-installer-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep reserved channels immutable
        run: |
          python3 -B 2022/beam/check_reserved_channel.py --root .
          python3 -B -m unittest discover -s 2022/beam/tests -p test_reserved_channel.py -v
      - name: Verify public installer provenance and scope
        run: python3 -B -m unittest discover -s tests -p test_public_installer_contract.py -v

  public-installer-qa:
    needs: contract
    permissions:
      contents: read
    # Immutable trusted public source. The caller's actions artifact lives
    # in b1glord/ragnarokclientpatch, not in the source or private client repo.
    uses: LevelUpGT/beam-patcher/.github/workflows/ragnar-turkuaz-installer-qa.yml@1289a50d8f230f8c739a4ad8dae088dd6355b992
    with:
      source_ref: 1289a50d8f230f8c739a4ad8dae088dd6355b992
