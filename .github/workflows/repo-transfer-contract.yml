# Dosya Yolu: REPO_ROOT/.github/workflows/repo-transfer-contract.yml
# Amac: Transfer sonrasi public patch URL ve paket butunlugu kontratini sinar
# Modul - GitHub Actions YAML
# Version: 1.0.0
# Aciklama: Sadece read-only CI; kurulum/yayinlama yapmaz
# Bagimli Oldugu Katman: Testing
name: Public Patch URL Migration Contract

on:
  pull_request:
    paths:
      - "README.md"
      - "2015/beam/config.yml"
      - "2015/rpatchur/config.yml"
      - "2022/beam/**"
      - "2022/server-compatibility.yml"
      - "beam/config.yml"
      - "rpatchur/config.yml"
      - "tests/test_repo_transfer_contract.py"
      - ".github/workflows/repo-transfer-contract.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "2015/beam/config.yml"
      - "2015/rpatchur/config.yml"
      - "2022/beam/**"
      - "2022/server-compatibility.yml"
      - "beam/config.yml"
      - "rpatchur/config.yml"
      - "tests/test_repo_transfer_contract.py"
      - ".github/workflows/repo-transfer-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-transfer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify canonical owner and legacy THOR source parity
        run: python3 -B -m unittest discover -s tests -p 'test_repo_transfer_contract.py' -v
      - name: Verify reserved 2022 BEAM channel is still disabled
        run: python3 -B 2022/beam/check_reserved_channel.py --root .
